rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration exposes button entities and no custom service actions.
  appropriate-polling:
    status: exempt
    comment: The charger sends status changes over one local push connection.
  brands:
    status: todo
    comment: Brand assets require maintainer review before a home-assistant/brands PR.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration exposes button entities and no custom service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no custom triggers.
  entity-event-setup:
    status: exempt
    comment: The integration provides no event entities.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The local charger protocol has no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry represents exactly one physical charger.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One config entry represents exactly one physical charger.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing: done
