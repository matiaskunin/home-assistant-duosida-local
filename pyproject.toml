[project]
name = "home-assistant-duosida-local"
version = "0.1.0a1"
description = "Local-only Home Assistant integration for verified Duosida EV chargers"
requires-python = ">=3.14.2,<3.15"
license = "GPL-3.0-only"
authors = [{ name = "Matias Kunin" }]
dependencies = []

[dependency-groups]
dev = [
  "duosida-local==0.1.0a1",
  "homeassistant==2026.8.3",
  "mypy==2.3.1",
  "prek==0.5.0",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.357",
  "ruff==0.16.5",
]

[tool.uv.sources]
duosida-local = { path = "../duosida-local", editable = true }

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]
ignore = ["ASYNC109", "COM812"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components"]
mypy_path = "../duosida-local/src"
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=custom_components.duosida_local --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
